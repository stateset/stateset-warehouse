name: warehouse checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: warehouse-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: warehouse
          POSTGRES_PASSWORD: warehouse
          POSTGRES_DB: warehouse_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U warehouse -d warehouse_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      WMS_TEST_DATABASE_URL: postgres://warehouse:warehouse@127.0.0.1:5432/warehouse_test
      WMS_RESTORE_ADMIN_URL: postgres://warehouse:warehouse@127.0.0.1:5432/warehouse_test
      WMS_PG_BIN: /usr/lib/postgresql/16/bin
      WMS_RELEASE_REVISION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.90.0
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Install matching PostgreSQL archive tools
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client-16
      - run: npm --prefix dashboard ci --no-audit --no-fund
      - run: cd dashboard && npx playwright install --with-deps chromium
      - name: Run the same complete software release gate used locally
        env:
          WMS_RELEASE_ARTIFACT_DIR: ${{ runner.temp }}/warehouse-release-qualification
        run: bash scripts/qualify-release.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: warehouse-release-qualification
          retention-days: 14
          if-no-files-found: warn
          path: ${{ runner.temp }}/warehouse-release-qualification/publish
