name: warehouse checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: warehouse-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: warehouse
          POSTGRES_PASSWORD: warehouse
          POSTGRES_DB: warehouse_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U warehouse -d warehouse_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      WMS_TEST_DATABASE_URL: postgres://warehouse:warehouse@127.0.0.1:5432/warehouse_test
      WMS_RESTORE_ADMIN_URL: postgres://warehouse:warehouse@127.0.0.1:5432/warehouse_test
      WMS_PG_BIN: /usr/lib/postgresql/16/bin
      WMS_RELEASE_REVISION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Audit public source and full available Git history
        run: |
          python3 - <<'PY'
          import hashlib, os, pathlib, tarfile, urllib.request
          directory = pathlib.Path(os.environ['RUNNER_TEMP']) / 'warehouse-gitleaks'
          directory.mkdir(mode=0o700)
          url = 'https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz'
          archive = directory / 'gitleaks.tar.gz'
          with urllib.request.urlopen(url, timeout=60) as response:
              data = response.read()
          assert hashlib.sha256(data).hexdigest() == '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb', 'Gitleaks asset digest differs'
          archive.write_bytes(data)
          with tarfile.open(archive) as source:
              member = source.getmember('gitleaks')
              assert member.isfile()
              binary = directory / 'gitleaks'
              binary.write_bytes(source.extractfile(member).read())
              binary.chmod(0o700)
          PY
          python3 scripts/public_source_audit.py --repository . \
            --gitleaks "$RUNNER_TEMP/warehouse-gitleaks/gitleaks" \
            --output "$RUNNER_TEMP/warehouse-source-review"
      - uses: dtolnay/rust-toolchain@1.90.0
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Install matching PostgreSQL archive tools
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client-16
      - run: npm --prefix dashboard ci --no-audit --no-fund
      - run: cd dashboard && npx playwright install --with-deps chromium
      - name: Run the same complete software release gate used locally
        env:
          WMS_RELEASE_ARTIFACT_DIR: ${{ runner.temp }}/warehouse-release-qualification
        run: bash scripts/qualify-release.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: warehouse-source-review
          retention-days: 14
          if-no-files-found: warn
          path: ${{ runner.temp }}/warehouse-source-review/report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: warehouse-release-qualification
          retention-days: 14
          if-no-files-found: warn
          path: ${{ runner.temp }}/warehouse-release-qualification/publish
