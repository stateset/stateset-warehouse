[package]
name = "stateset-warehouse"
version = "0.4.2"
edition = "2021"
rust-version = "1.90"
description = "StateSet warehouse execution and inventory authority"
license = "MIT OR Apache-2.0"
repository = "https://github.com/stateset/stateset-warehouse"

[dependencies]
stateset-core = { version = "=1.39.0", path = "vendor/stateset-icommerce/crates/stateset-core" }
stateset-primitives = { version = "=1.39.0", path = "vendor/stateset-icommerce/crates/stateset-primitives" }
rust_decimal = "1.36"
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
uuid = { version = "1", features = ["v4", "serde"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "json"] }
tower-http = { version = "0.6", features = ["trace", "fs", "set-header"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"
sha2 = "0.10"
subtle = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
jsonwebtoken = { version = "10", default-features = false, features = ["aws_lc_rs"] }
rmcp = { version = "=3.5.1", default-features = false, features = ["server", "transport-streamable-http-server"] }
schemars = { version = "=1.2.2", features = ["derive"] }
tower = { version = "0.5", features = ["util"] }

[dev-dependencies]
proptest = "1"
http-body-util = "0.1"
# The SDK client is used only against owned loopback HTTP test listeners.
rmcp = { version = "=3.5.1", default-features = false, features = ["client", "transport-streamable-http-client-reqwest"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"

[profile.dev]
debug = 0

[profile.test]
debug = 0
