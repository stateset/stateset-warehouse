<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="610" viewBox="0 0 1120 610" role="img" aria-labelledby="title description">
<title id="title">Ghostty WMS operations board and compact quantities</title>
<desc id="description">Recorded synthetic 49 by 20 PTY text rendered as SVG. The idle operations board refreshes read-only data and compact inventory retains exact quantities. This is not a native Ghostty screenshot.</desc>
